[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "os400-knowledge-workbench"
version = "0.1.0"
description = "Local, cited C++ AST knowledge graphs backed only by Neo4j"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "neo4j>=5.28,<7",
  "libclang==18.1.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
knowledge-workbench = "knowledge_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
